<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinPoint SEO</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        const T = {
            bg: "#F7F6F2",
            surface: "#FFFFFF",
            ink: "#0D0D0D",
            pin: "#E8341C",
            border: "#E4E2DC",
            success: "#1A7F4B",
        };

        async function sendEmail(data) {
            try {
                const response = await fetch('https://formspree.io/f/mojozgde', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: data.name,
                        email: data.email,
                        business_name: data.bizName,
                        postcode: data.postcode,
                        score: data.score,
                        date: new Date().toLocaleDateString(),
                    })
                });
                return response.ok;
            } catch (e) {
                console.error("Error:", e);
                return false;
            }
        }

        function App() {
            const [view, setView] = useState("landing");
            const [bizName, setBizName] = useState("");
            const [postcode, setPostcode] = useState("");
            const [scanStage, setScanStage] = useState(0);
            const [score, setScore] = useState(0);
            const [email, setEmail] = useState("");
            const [name, setName] = useState("");
            const [submitted, setSubmitted] = useState(false);
            const [loading, setLoading] = useState(false);

            const handleUnlock = async () => {
                if (!name.trim() || !email.trim()) {
                    alert("Enter name and email");
                    return;
                }

                setLoading(true);
                const success = await sendEmail({
                    name,
                    email,
                    bizName,
                    postcode,
                    score
                });
                setLoading(false);

                if (success) {
                    setSubmitted(true);
                } else {
                    alert("Failed to save. Try again.");
                }
            };

            const runScan = () => {
                setView("scanning");
                setScanStage(0);
                let stage = 0;
                const interval = setInterval(() => {
                    stage++;
                    setScanStage(stage);
                    if (stage >= 4) {
                        clearInterval(interval);
                        setTimeout(() => {
                            setScore(35 + Math.floor(Math.random() * 35));
                            setView("gate");
                        }, 500);
                    }
                }, 600);
            };

            if (view === "landing") return (
                <div style={{minHeight:"100vh", background:T.bg}}>
                    <nav style={{background:T.surface, padding:"20px", borderBottom:`1px solid ${T.border}`}}>
                        <span style={{fontSize:20, fontWeight:800, color:T.ink}}>PinPoint.</span>
                    </nav>
                    <div style={{maxWidth:600, margin:"100px auto", textAlign:"center", padding:"20px"}}>
                        <h1 style={{fontSize:48, fontWeight:800, margin:"0 0 20px", color:T.ink}}>Are your customers finding your competitors?</h1>
                        <p style={{fontSize:16, color:"#666", margin:"0 0 30px"}}>Get your free local SEO audit in 60 seconds.</p>
                        <button onClick={() => setView("form")} style={{background:T.pin, color:"#fff", border:"none", padding:"15px 40px", fontSize:16, fontWeight:700, borderRadius:8, cursor:"pointer"}}>
                            Check my ranking →
                        </button>
                    </div>
                </div>
            );

            if (view === "form") return (
                <div style={{minHeight:"100vh", background:T.bg, padding:"40px 20px"}}>
                    <button onClick={() => setView("landing")} style={{background:"none", border:"none", cursor:"pointer", color:T.ink, fontWeight:600, marginBottom:20}}>← Back</button>
                    <div style={{maxWidth:400, margin:"0 auto"}}>
                        <h2 style={{fontSize:28, fontWeight:800, marginBottom:30, color:T.ink}}>Free audit</h2>
                        <input value={bizName} onChange={e => setBizName(e.target.value)} placeholder="Business name" style={{width:"100%", padding:"12px", borderRadius:6, border:`1px solid ${T.border}`, marginBottom:12, fontSize:14}} />
                        <input value={postcode} onChange={e => setPostcode(e.target.value)} placeholder="Postcode" style={{width:"100%", padding:"12px", borderRadius:6, border:`1px solid ${T.border}`, marginBottom:20, fontSize:14}} />
                        <button onClick={runScan} disabled={!bizName.trim() || !postcode.trim()} style={{width:"100%", background: bizName.trim() && postcode.trim() ? T.pin : "#ccc", color:"#fff", border:"none", padding:"12px", borderRadius:6, cursor: bizName.trim() && postcode.trim() ? "pointer" : "default", fontWeight:700}}>
                            Scan →
                        </button>
                    </div>
                </div>
            );

            if (view === "scanning") return (
                <div style={{minHeight:"100vh", background:T.bg, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center"}}>
                    <div style={{fontSize:48, marginBottom:20}}>📍</div>
                    <h2 style={{fontSize:24, fontWeight:800, marginBottom:30, color:T.ink}}>Scanning…</h2>
                    <div style={{maxWidth:300}}>
                        {["Locating profile", "Checking reviews", "Auditing website", "Calculating score"].map((text, i) => (
                            <div key={i} style={{display:"flex", alignItems:"center", gap:12, padding:"12px 0", opacity: i <= scanStage ? 1 : 0.3}}>
                                <div style={{width:24, height:24, borderRadius:"50%", background: i < scanStage ? T.success : i === scanStage ? T.pin : "#ddd", color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800}}>
                                    {i < scanStage ? "✓" : ""}
                                </div>
                                <span style={{fontSize:14, color:T.ink}}>{text}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );

            if (view === "gate") return (
                <div style={{minHeight:"100vh", background:T.bg, padding:"40px 20px"}}>
                    <div style={{maxWidth:400, margin:"60px auto"}}>
                        <div style={{background:T.surface, padding:30, borderRadius:12, border:`1px solid ${T.border}`}}>
                            <h3 style={{fontSize:20, fontWeight:800, margin:"0 0 20px", color:T.ink}}>Your report is ready</h3>
                            <input value={name} onChange={e => setName(e.target.value)} placeholder="Your name" style={{width:"100%", padding:"12px", borderRadius:6, border:`1px solid ${T.border}`, marginBottom:12, fontSize:14, boxSizing:"border-box"}} />
                            <input value={email} onChange={e => setEmail(e.target.value)} placeholder="Email" type="email" style={{width:"100%", padding:"12px", borderRadius:6, border:`1px solid ${T.border}`, marginBottom:20, fontSize:14, boxSizing:"border-box"}} />
                            <button onClick={handleUnlock} disabled={loading} style={{width:"100%", background:T.pin, color:"#fff", border:"none", padding:"12px", borderRadius:6, fontWeight:700, cursor: loading ? "default" : "pointer", fontSize:14, opacity: loading ? 0.7 : 1}}>
                                {loading ? "Saving…" : "Unlock →"}
                            </button>
                        </div>
                    </div>
                </div>
            );

            if (submitted) return (
                <div style={{minHeight:"100vh", background:T.bg, display:"flex", alignItems:"center", justifyContent:"center"}}>
                    <div style={{textAlign:"center"}}>
                        <div style={{fontSize:64, marginBottom:20}}>✓</div>
                        <h2 style={{fontSize:28, fontWeight:800, margin:"0 0 10px", color:T.success}}>Done!</h2>
                        <p style={{fontSize:16, color:"#666", margin:"0 0 30px"}}>Lead saved. Check your email at <strong>{email}</strong></p>
                        <button onClick={() => {setView("landing"); setSubmitted(false); setName(""); setEmail(""); setBizName(""); setPostcode("");}} style={{background:T.pin, color:"#fff", border:"none", padding:"12px 30px", borderRadius:6, fontWeight:700, cursor:"pointer"}}>
                            New audit
                        </button>
                    </div>
                </div>
            );

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #F7F6F2; }
    </style>
</body>
</html>
